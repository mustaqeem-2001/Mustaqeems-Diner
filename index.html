<html>
    <head>
       <link rel="stylesheet" href="index.css">
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Roboto:ital,wght@0,100..900;1,100..900&family=Smythe&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- CDN -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
   </head>
    <body>
        <div class="content">
            <section class="header" id="header">
                <!-- background image here -->
               <div class="header-text">
                  <h1>Mustaqeem's Diner</h1>
                  <p id="title-info">The best burgers and pizzas in town</p>
               </div>
            </section>
            <section class="items-list" id="items-list">
                <!-- Items to be sold go here -->
            </section>
            <section class="order-details" id="order-details">
               <h2 class="order-title">Your Order</h2>
               <div class="order-items" id="order-items"></div>
               <button class="complete-order-btn" id="complete-order-btn">Complete order</button>
            </section>

            <section class="card-details" id="card-details">
               <h2>Enter your card details</h2>
               <form class="card-details-form">
                  <input type="text" 
                     placeholder="Enter your name" 
                     class="input-name card-details-group" 
                     id="input-name" 
                     name="input-name"
                     aria-label="Name on card"
                     minlength="1"
                     required />
                  
                  <input type="text" 
                     placeholder="Enter your card number" 
                     class="card-number-input card-details-group" 
                     id="card-number-input"
                     name="card-number-input"
                     aria-label="Card Number"
                     maxlength="19"
                     minlength="12"
                     required />
                  
                  <input type="password" 
                     placeholder="Enter CVV"  
                     class="cvv-input card-details-group" 
                     id="cvv-input" 
                     name="cvv-input"
                     minlength="3"
                     maxlength="4"
                     aria-label="Card CVV"
                     required />
                  <button type="submit" class="submitPayBtn" id="submitPayBtn">Pay</button>
               </form>
            </section>
            <section >
               <p class="thank-you-message" id="thankYouMessageP">
                  Thanks,
                  <span class="card-name" id="cardName"></span>
                  ! Your order is on its way!
               </p>
            </section>
        </div>

	<script src="index.js" type="module"></script>
    </body>
</html>
